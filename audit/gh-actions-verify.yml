# GitHub Actions workflow: verify the dataset and model on every push/PR.
#
# WHY THIS FILE IS NOT IN .github/workflows/ YET
# --------------------------------------------
# GitHub refuses to let an OAuth App create or update a file under .github/workflows/
# unless the token carries the `workflow` scope. The `gh` CLI login on this machine has
# scopes `gist, read:org, repo` — but not `workflow` — so a push containing this file is
# rejected with:
#   ! [remote rejected] main -> main (refusing to allow an OAuth App to create or update
#     workflow `.github/workflows/verify.yml` without `workflow` scope)
#
# TO ACTIVATE (one time, needs a human to approve the scope in the browser):
#   gh auth refresh -s workflow
#   mkdir -p .github/workflows && mv audit/gh-actions-verify.yml .github/workflows/verify.yml
#   git add .github && git commit -m "ci: enable the verification workflow" && git push
#
# The checks themselves do not depend on CI: `node audit/verify.js` runs identically
# locally and exits non-zero on any failure, so it can also be wired into a pre-push hook.

name: Verify dataset & model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install: the harness is plain Node with zero packages.
      - name: Run verification harness
        run: node audit/verify.js

      - name: Summary
        if: always()
        run: echo "audit/verify.js checks schema, records/margins, poll membership, kickoff rank tags, derived top25Wins, SOS permutation, the Colley claim, matchup-engine self-consistency, documented-vs-implemented weights and the UI regressions that have shipped before."
